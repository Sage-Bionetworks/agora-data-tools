destination: &dest syn17015333
staging_path: ./staging
gx_folder: syn52948670
gx_table: syn60527065
team_images_id: syn12861877
# Reusable file reference anchors used by datasets below.
files:
  # Metadata & Configuration
  - &drug_metadata                { name: drug_metadata               , format: json   , id: syn73724873.12  }
  - &ensg_to_uniprot_mapping      { name: ensg_to_uniprot_mapping     , format: tsv    , id: syn54113663.7   }
  - &eqtl                         { name: eqtl                        , format: csv    , id: syn12514912.3   }
  - &gene_metadata                { name: gene_metadata               , format: feather, id: syn25953363.17  }
  - &igap                         { name: igap                        , format: csv    , id: syn12514826.5   }
  - &pharos_classes               { name: pharos_classes              , format: csv    , id: syn64123611.3   }
  - &ui_config                    { name: ui_config                   , format: json   , id: syn73677126     }
  # Results
  - &diff_exp_data                { name: diff_exp_data               , format: tsv    , id: syn27211942.1   }
  - &genes_biodomains             { name: genes_biodomains            , format: csv    , id: syn44151254.5   }
  - &median_expression            { name: median_expression           , format: csv    , id: syn27211878.2   }
  - &metabolomics                 { name: metabolomics                , format: feather, id: syn26064497.1   }
  - &networks                     { name: networks                    , format: csv    , id: syn11685347.1   }
  - &neuropath_regression_results { name: neuropath_regression_results, format: csv    , id: syn22017882.5   }
  - &overall_scores               { name: overall_scores              , format: table  , id: syn25575156.13  }
  - &proteomics                   { name: proteomics                  , format: csv    , id: syn18689335.4   }
  - &proteomics_tmt               { name: proteomics_tmt              , format: csv    , id: syn35221005.2   }
  - &proteomics_srm               { name: proteomics_srm              , format: csv    , id: syn52579640.4   }
  # Nominations & Supporting Data
  - &drug_list                    { name: drug_list                   , format: csv    , id: syn73677240.14  }
  - &target_exp_validation        { name: target_exp_validation       , format: csv    , id: syn24184512.11  }
  - &target_list                  { name: target_list                 , format: csv    , id: syn12540368.74  }
  - &team_member_info             { name: team_member_info            , format: csv    , id: syn12615633.22  }
  - &team_info                    { name: team_info                   , format: csv    , id: syn12615624.21  }
  - &tep_adi_info                 { name: tep_adi_info                , format: csv    , id: syn51942280.6   }

datasets:
  - biodomain_info:
      files:
        - <<: *genes_biodomains
      final_format: json
      custom_transformations: transform_biodomain_info
      column_rename:
        biodomain: name
      destination: *dest
      gx_enabled: true

  - genes_biodomains:
      files:
        - <<: *genes_biodomains
      final_format: json
      custom_transformations: transform_genes_biodomains
      column_rename:
        ensembl_id: ensembl_gene_id
        goterm_name: go_terms
      destination: *dest
      gx_enabled: true
      gx_nested_columns:
        - gene_biodomains

  - neuropath_corr:
      files:
        - <<: *neuropath_regression_results
      final_format: json
      column_rename:
        ensg: ensembl_gene_id
        gname: hgnc_gene_id
      agora_rename:
        ensembl_gene_id: ensg
        hgnc_gene_id: gname
      destination: *dest
      gx_enabled: true

  - proteomics:
      files:
        - <<: *proteomics
      final_format: json
      custom_transformations: transform_proteomics
      column_rename:
        genename: hgnc_symbol
        ensg: ensembl_gene_id
      destination: *dest
      gx_enabled: true

  - proteomics_tmt:
      files:
        - <<: *proteomics_tmt
      final_format: json
      custom_transformations: transform_proteomics
      column_rename:
        genename: hgnc_symbol
        ensg: ensembl_gene_id
      destination: *dest
      gx_enabled: true

  - proteomics_srm:
      files:
        - <<: *proteomics_srm
      final_format: json
      custom_transformations: transform_proteomics
      column_rename:
        genename: hgnc_symbol
        ensg: ensembl_gene_id
      destination: *dest
      gx_enabled: true

  - target_exp_validation_harmonized:
      files:
        - <<: *target_exp_validation
      final_format: json
      destination: *dest
      gx_enabled: true

  - metabolomics:
      files:
        - <<: *metabolomics
      final_format: json
      destination: *dest
      gx_enabled: true

  - gene_info:
      files:
        - <<: *gene_metadata
        - <<: *igap
        - <<: *eqtl
        - <<: *proteomics
        - <<: *proteomics_tmt
        - <<: *proteomics_srm
        - <<: *diff_exp_data
        - <<: *target_list
        - <<: *median_expression
        - <<: *genes_biodomains
        - <<: *tep_adi_info
        - <<: *ensg_to_uniprot_mapping
        - <<: *pharos_classes
      final_format: json
      custom_transformations:
        transform_gene_info:
          adjusted_p_value_threshold: 0.05
          protein_level_threshold: 0.05
      column_rename:
        ensg: ensembl_gene_id
        ensembl_id: ensembl_gene_id
        geneid: ensembl_gene_id
        has_eqtl: is_eqtl
        minimumlogcpm: min
        quartile1logcpm: first_quartile
        medianlogcpm: median
        meanlogcpm: mean
        quartile3logcpm: third_quartile
        maximumlogcpm: max
        possible_replacement: ensembl_possible_replacements
        permalink: ensembl_permalink
        uniprotkb_accession: uniprotkb_accessions
        resource_identifier: ensembl_gene_id
      agora_rename:
        symbol: hgnc_symbol
      destination: *dest
      gx_enabled: true
      gx_nested_columns:
        - target_nominations
        - median_expression
        - druggability
        - ensembl_info

  - team_info:
      files:
        - <<: *team_info
        - <<: *team_member_info
      final_format: json
      custom_transformations: transform_team_info
      destination: *dest
      gx_enabled: true
      gx_nested_columns:
        - members

  - overall_scores:
      files:
        - <<: *overall_scores
      final_format: json
      custom_transformations: transform_overall_scores
      column_rename:
        genename: hgnc_gene_id
      agora_rename:
        ensg: ensembl_gene_id
        hgnc_gene_id: hgnc_symbol
        geneticsscore: genetics_score
        overall: target_risk_score
        omicsscore: multi_omics_score
      destination: *dest
      gx_enabled: true

  - network:
      files:
        - <<: *networks
      final_format: json
      provenance:
        - syn27211942.1
      agora_rename:
        genea_ensembl_gene_id: geneA_ensembl_gene_id
        genea_external_gene_name: geneA_external_gene_name
        geneb_ensembl_gene_id: geneB_ensembl_gene_id
        geneb_external_gene_name: geneB_external_gene_name
        brainregion: brainRegion
      destination: *dest
      gx_enabled: true

  - rnaseq_differential_expression:
      files:
        - <<: *diff_exp_data
      final_format: json
      custom_transformations: transform_rnaseq_differential_expression
      destination: *dest
      gx_enabled: true

  - distribution_data:
      files:
        - <<: *overall_scores
      final_format: json
      custom_transformations:
        transform_distribution_data:
          overall_max_score: 5
          genetics_max_score: 3
          omics_max_score: 2
      column_rename:
        overall: target_risk_score
        geneticsscore: genetics_score
        omicsscore: multi_omics_score
      destination: *dest
      gx_enabled: true
      gx_nested_columns:
        - target_risk_score
        - genetics_score
        - multi_omics_score

  - rna_distribution_data:
      files:
        - <<: *diff_exp_data
      final_format: json
      custom_transformations: transform_rna_distribution_data
      destination: *dest
      gx_enabled: true

  - proteomics_distribution_data:
      files:
        - <<: *proteomics
        - <<: *proteomics_tmt
        - <<: *proteomics_srm
      final_format: json
      custom_transformations: transform_proteomics_distribution_data
      destination: *dest
      gx_enabled: true

  - drug_info:
      files:
        - <<: *drug_metadata
        - <<: *drug_list
        - <<: *gene_metadata
        - <<: *target_list
      final_format: json
      custom_transformations: transform_drug_info
      column_rename:
        source: program
      destination: *dest
      gx_enabled: false

  - nominated_drugs:
      files:
        - <<: *drug_list
        - <<: *drug_metadata
      final_format: json
      custom_transformations: transform_nominated_drugs
      destination: *dest
      gx_enabled: true

  - nominated_targets:
      files:
        - <<: *target_list
        - <<: *gene_metadata
        - <<: *pharos_classes
      final_format: json
      custom_transformations: transform_nominated_targets
      agora_rename:
        symbol: hgnc_symbol
      destination: *dest
      gx_enabled: false

  - ui_config:
      files:
        - name: ui_config
          id: syn73677126.15
          format: json
      final_format: json
      destination: *dest
      gx_enabled: false
