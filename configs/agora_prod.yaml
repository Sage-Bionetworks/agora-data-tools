destination: &dest syn12177492
staging_path: ./staging
gx_folder: syn52948668
gx_table: syn60527066
team_images_id: syn12861877
# Reusable file and column rename reference anchors used by multiple datasets below.
shared:
  files:
    - &genes_biodomains { name: genes_biodomains, format: csv    , id: syn44151254.5 }
    - &overall_scores   { name: overall_scores  , format: table  , id: syn25575156.13 }
    - &proteomics       { name: proteomics      , format: csv    , id: syn18689335.4 }
    - &proteomics_tmt   { name: proteomics_tmt  , format: csv    , id: syn35221005.2 }
    - &proteomics_srm   { name: proteomics_srm  , format: csv    , id: syn52579640.4 }
    - &diff_exp_data    { name: diff_exp_data   , format: tsv    , id: syn27211942.1 }
    - &gene_metadata    { name: gene_metadata   , format: feather, id: syn25953363.17 }
    - &target_list      { name: target_list     , format: csv    , id: syn12540368.74 }
    - &pharos_classes   { name: pharos_classes  , format: csv    , id: syn64123611.3 }
    - &drug_list        { name: drug_list       , format: csv    , id: syn73677240.14 }

datasets:
  - biodomain_info:
      files:
        - <<: *genes_biodomains
      final_format: json
      custom_transformations: transform_biodomain_info
      column_rename:
        biodomain: name
      destination: *dest
      gx_enabled: true

  - genes_biodomains:
      files:
        - <<: *genes_biodomains
      final_format: json
      custom_transformations: transform_genes_biodomains
      column_rename:
        ensembl_id: ensembl_gene_id
        goterm_name: go_terms
      destination: *dest
      gx_enabled: true
      gx_nested_columns:
        - gene_biodomains

  - neuropath_corr:
      files:
        - name: neuropath_regression_results
          id: syn22017882.5
          format: csv
      final_format: json
      column_rename:
        ensg: ensembl_gene_id
        gname: hgnc_gene_id
      agora_rename:
        ensembl_gene_id: ensg
        hgnc_gene_id: gname
      destination: *dest
      gx_enabled: true

  - proteomics:
      files:
        - <<: *proteomics
      final_format: json
      custom_transformations: transform_proteomics
      column_rename:
        genename: hgnc_symbol
        ensg: ensembl_gene_id
      destination: *dest
      gx_enabled: true

  - proteomics_tmt:
      files:
        - <<: *proteomics_tmt
      final_format: json
      custom_transformations: transform_proteomics
      column_rename:
        genename: hgnc_symbol
        ensg: ensembl_gene_id
      destination: *dest
      gx_enabled: true

  - proteomics_srm:
      files:
        - <<: *proteomics_srm
      final_format: json
      custom_transformations: transform_proteomics
      column_rename:
        genename: hgnc_symbol
        ensg: ensembl_gene_id
      destination: *dest
      gx_enabled: true

  - target_exp_validation_harmonized:
      files:
        - name: target_exp_validation
          id: syn24184512.11
          format: csv
      final_format: json
      destination: *dest
      gx_enabled: true

  - metabolomics:
      files:
        - name: metabolomics
          id: syn26064497.1
          format: feather
      final_format: json
      destination: *dest
      gx_enabled: true

  - gene_info:
      files:
        - <<: *gene_metadata
        - name: igap
          id: syn12514826.5
          format: csv
        - name: eqtl
          id: syn12514912.3
          format: csv
        - <<: *proteomics
        - <<: *proteomics_tmt
        - <<: *proteomics_srm
        - <<: *diff_exp_data
        - <<: *target_list
        - name: median_expression
          id: syn27211878.2
          format: csv
        - <<: *genes_biodomains
        - name: tep_adi_info
          id: syn51942280.6
          format: csv
        - name: ensg_to_uniprot_mapping
          id: syn54113663.7
          format: tsv
        - <<: *pharos_classes
      final_format: json
      custom_transformations:
        transform_gene_info:
          adjusted_p_value_threshold: 0.05
          protein_level_threshold: 0.05
      column_rename:
        ensg: ensembl_gene_id
        ensembl_id: ensembl_gene_id
        geneid: ensembl_gene_id
        has_eqtl: is_eqtl
        minimumlogcpm: min
        quartile1logcpm: first_quartile
        medianlogcpm: median
        meanlogcpm: mean
        quartile3logcpm: third_quartile
        maximumlogcpm: max
        possible_replacement: ensembl_possible_replacements
        permalink: ensembl_permalink
        uniprotkb_accession: uniprotkb_accessions
        resource_identifier: ensembl_gene_id
      agora_rename:
        symbol: hgnc_symbol
      destination: *dest
      gx_enabled: true
      gx_nested_columns:
        - target_nominations
        - median_expression
        - druggability
        - ensembl_info

  - team_info:
      files:
        - name: team_info
          id: syn12615624.21
          format: csv
        - name: team_member_info
          id: syn12615633.22
          format: csv
      final_format: json
      custom_transformations: transform_team_info
      destination: *dest
      gx_enabled: true
      gx_nested_columns:
        - members

  - overall_scores:
      files:
        - <<: *overall_scores
      final_format: json
      custom_transformations: transform_overall_scores
      column_rename:
        genename: hgnc_gene_id
      agora_rename:
        ensg: ensembl_gene_id
        hgnc_gene_id: hgnc_symbol
        geneticsscore: genetics_score
        overall: target_risk_score
        omicsscore: multi_omics_score
      destination: *dest
      gx_enabled: true

  - network:
      files:
        - name: networks
          id: syn11685347.1
          format: csv
      final_format: json
      provenance:
        - syn27211942.1
      agora_rename:
        genea_ensembl_gene_id: geneA_ensembl_gene_id
        genea_external_gene_name: geneA_external_gene_name
        geneb_ensembl_gene_id: geneB_ensembl_gene_id
        geneb_external_gene_name: geneB_external_gene_name
        brainregion: brainRegion
      destination: *dest
      gx_enabled: true

  - rnaseq_differential_expression:
      files:
        - <<: *diff_exp_data
      final_format: json
      custom_transformations: transform_rnaseq_differential_expression
      destination: *dest
      gx_enabled: true

  - distribution_data:
      files:
        - <<: *overall_scores
      final_format: json
      custom_transformations:
        transform_distribution_data:
            overall_max_score: 5
            genetics_max_score: 3
            omics_max_score: 2
      column_rename:
        overall: target_risk_score
        geneticsscore: genetics_score
        omicsscore: multi_omics_score
      destination: *dest
      gx_enabled: true
      gx_nested_columns:
        - target_risk_score
        - genetics_score
        - multi_omics_score

  - rna_distribution_data:
      files:
        - <<: *diff_exp_data
      final_format: json
      custom_transformations: transform_rna_distribution_data
      destination: *dest
      gx_enabled: true

  - proteomics_distribution_data:
      files:
        - <<: *proteomics
        - <<: *proteomics_tmt
        - <<: *proteomics_srm
      final_format: json
      custom_transformations: transform_proteomics_distribution_data
      destination: *dest
      gx_enabled: true

  - drug_info:
      files:
        - name: ot_drug_metadata
          id: syn73724873.12
          format: json
        - <<: *drug_list
        - <<: *gene_metadata
        - name: harmonized_targets
          id: syn12540368.74
          format: csv
      final_format: json
      custom_transformations: transform_drug_info
      column_rename:
        source: program
      destination: *dest
      gx_enabled: false

  - nominated_drugs:
      files:
        - <<: *drug_list
        - name: drug_metadata
          id: syn73724873.12
          format: json
      final_format: json
      custom_transformations: transform_nominated_drugs
      destination: *dest
      gx_enabled: false

  - nominated_targets:
      files:
        - <<: *target_list
        - <<: *gene_metadata
        - <<: *pharos_classes
      final_format: json
      custom_transformations: transform_nominated_targets
      agora_rename:
        symbol: hgnc_symbol
      destination: *dest
      gx_enabled: false

  - ui_config:
      files:
        - name: ui_config
          id: syn73677126 # TODO pin this once source is finalized
          format: json
      final_format: json
      destination: *dest
      gx_enabled: false
