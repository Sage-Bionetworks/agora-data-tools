datasets:
  - model_details:
      files:
        - <<: *model_info
        - <<: *allele_info
        - <<: *pathology
        - <<: *biomarkers
        - <<: *human_transgene_allele_map
        - <<: *model_results_info
        - <<: *immunohisto_measure_order
      final_format: json
      destination: *dest
      custom_transformations: transform_model_details
      column_rename:
        gene: modified_gene
        ensembl_id: human_ensembl_id
        agedeath: age
        age_death: age
        measurement: value
        type: evidence_type
        model: name
        key: dataset_name
        items: evidence_type
      gx_nested_columns:
        - genetic_info
        - biomarkers
        - pathology
      gx_enabled: true

  - marmo_details:
      files:
        - <<: *marmo_metadata
        - <<: *marmo_genotype_label_map
        - <<: *marmo_biomarker_measure_info
        - <<: *marmo_individual_metadata
        - <<: *marmo_biospecimen_metadata
        - <<: *marmo_results
      final_format: json
      destination: *dest
      custom_transformations: transform_marmo_details

  - disease_correlation:
      files:
        - <<: *disease_correlation_results
        - <<: *model_info
        - <<: *allele_info
        - <<: *human_transgene_allele_map
      final_format: json
      destination: *dest
      custom_transformations: transform_disease_correlation
      column_rename:
        ensembl_id: human_ensembl_id

  - ui_config:
      files:
        - <<: *ui_config
      final_format: json
      destination: *dest
      gx_enabled: true
      gx_nested_columns:
        - columns

  - model_overview:
      files:
        - <<: *model_info
        - <<: *model_results_info
        - <<: *allele_info
        - <<: *human_transgene_allele_map
      final_format: json
      destination: *dest
      custom_transformations: transform_model_overview
      column_rename:
        gene: modified_gene
        ensembl_id: human_ensembl_id
        model: name
      gx_enabled: true
      gx_nested_columns:
        - transcriptomics
        - disease_correlation
        - pathology
        - biomarkers
        - study_data
        - jax_strain

  - rna_de_aggregate:
      files:
        - <<: *genotype_label_map
        - <<: *mouse_gene_metadata
        - <<: *biodom_genes_mm
        - <<: *jax_5xFAD_de
        - <<: *jax_APOE4_Trem2_R47H_de
        - <<: *uci_3xTG_AD_de
        - <<: *uci_5xFAD_de
        - <<: *uci_ABCA7_de
        - <<: *uci_Trem2_R47H_NSS_de
      final_format: json
      destination: *dest
      custom_transformations: transform_rna_de_aggregate

  - rna_de_individual:
      files:
        - <<: *genotype_label_map
        - <<: *mouse_gene_metadata
        - <<: *jax_APOE4_Trem2_R47H_ne
        - <<: *jax_APOE4_ne
        - <<: *jax_Trem2_R47H_ne
        - <<: *uci_ABCA7_5xFAD_ne
        - <<: *uci_ABCA7_ne
        - <<: *uci_Trem2_R47H_NSS_5xFAD_ne
        - <<: *uci_Trem2_R47H_NSS_ne
        - <<: *uci_3xTG_AD_ne
        - <<: *uci_5xFAD_ne
        - <<: *jax_5xFAD_ne
      final_format: json
      destination: *dest
      custom_transformations: transform_rna_de_individual
