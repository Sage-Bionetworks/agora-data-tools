          id: syn71305327.2
          format: yaml
      final_format: json
      destination: *dest
      custom_transformations: transform_model_details
      column_rename:
        gene: modified_gene
        ensembl_id: human_ensembl_id
        agedeath: age
        age_death: age
        measurement: value
        type: evidence_type
        model: name
        key: dataset_name
        items: evidence_type
      gx_nested_columns:
        - genetic_info
        - biomarkers
        - pathology
      gx_enabled: true

  - disease_correlation:
