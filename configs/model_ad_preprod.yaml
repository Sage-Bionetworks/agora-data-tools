datasets:
  - model_details:
      files:
        - <<: *model_info_file
        - name: allele_info
          id: syn64618791.6
          format: csv
        - name: pathology
          id: syn61357279.18
          format: csv
        - name: biomarkers
          id: syn61250724.12
